<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="image-section">
            <h1 class="odin">ODIN</h1>
        </div>
        <div class="content-section">
            <div class="top-section">This is not a real service! You know you need something
            like this in your life to help you realize your deepest dreams.
            Sign up now to get started.
            You know you want to.
            </div>
            <form class="signup-form">
                <div class="form-group">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="name" required>
                </div>

                <div class="form-group">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" required minlength="6" id="password" name="password" required>
                </div>
                 <div class="form-group">
                    <label for="passwordconf">Confirm Password</label>
                    <input type="password" required minlength="6" id="passwordconf" name="passwordconf" required>
                 </div>
                 <div class="form-group">
                    <label for="phonenumber">Phone Number</label>
                    <input type="phnumber" id="phnumber" name="phnumber" required>
                </div>
                 <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
        
            </form>
            <button type="submit" class="submit-btn">Sign Up</button>

            <div class="bottom-section">All rights reserved</div>
        </div>
    </div>
</body>
</html>
